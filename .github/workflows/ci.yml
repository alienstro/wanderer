# CI: checks each pull request to main with lint, typecheck, the tests and the import rules.
# The e2e tests stay local, because they build both apps and take too long for each PR.
name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the old run, so only the last commit uses Actions time.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API tests need a real Postgres. The port and the database are the same as in docker-compose.dev.yml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wanderer
          POSTGRES_PASSWORD: wanderer
          POSTGRES_DB: wanderer_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wanderer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://wanderer:wanderer@localhost:5433/wanderer_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # postinstall builds @wanderer/shared and runs prisma generate.
      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
